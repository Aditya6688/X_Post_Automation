name: Daily X Ghostwriter

on:
  schedule:
    - cron: '0 3 * * *' # Runs at 3 AM UTC (8:30 AM IST)
  workflow_dispatch: # Allows manual button click to run

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install requests feedparser openai notion-client
      - name: Run Script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
        run: python ghostwriter.py
